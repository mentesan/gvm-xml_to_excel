# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Install excelize
      run: go install github.com/360EntSecGroup-Skylar/excelize

    - name: Mod init
      run: go mod init gvm-xml_to_excel.go

    - name: Build
      run: go build -ldflags="-s -w" gvm-xml_to_excel.go
